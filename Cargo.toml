[package]
name = "tmux-drudwyn"
version = "2.0.0-alpha.1"
edition = "2024"
description = "A stateless, tmux-native supervisor for coding-agent workspaces"
license = "MIT"
repository = "https://github.com/Memnoc/tmux-drudwyn"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.28.1"
png = { version = "0.17", default-features = false }
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
thiserror = "2.0.18"

[profile.release]
lto = "thin"
strip = true

